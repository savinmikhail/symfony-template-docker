name: Set up persistent CI builder
description: Reuse bounded BuildKit state per repository, runner and trust boundary
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      with:
        name: ci-${{ github.event.repository.name }}-${{ runner.name }}-${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}
        keep-state: true
        buildkitd-config-inline: |
          [worker.oci]
            gc = true
            reservedSpace = "1GB"
            maxUsedSpace = "8GB"
            minFreeSpace = "15GB"
