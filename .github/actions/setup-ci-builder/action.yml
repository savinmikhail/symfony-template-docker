name: Set up persistent CI builder
description: Reuse bounded BuildKit state per repository, runner and trust boundary
runs:
  using: composite
  steps:
    - id: builder-id
      shell: bash
      env:
        BUILDER_REPOSITORY: ${{ github.event.repository.name }}
        BUILDER_RUNNER: ${{ runner.name }}
        BUILDER_TRUST: ${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}
      run: echo "name=$(bash scripts/ci/builder-name.sh "$BUILDER_REPOSITORY" "$BUILDER_RUNNER" "$BUILDER_TRUST")" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
      with:
        name: ${{ steps.builder-id.outputs.name }}
        keep-state: true
        buildkitd-config-inline: |
          [worker.oci]
            gc = true
            reservedSpace = "1GB"
            maxUsedSpace = "8GB"
            minFreeSpace = "15GB"
