name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy
        required: true
        type: string

permissions: { contents: read, packages: read }
concurrency: { group: production-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -Fx "${{ secrets.DEPLOY_HOST_FINGERPRINT }}"
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_TAG: ${{ inputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${DEPLOY_PATH}" "${DEPLOY_TAG}" <<'EOF'
          set -eu
          DEPLOY_PATH="$1"; DEPLOY_TAG="$2"; cd "${DEPLOY_PATH}"
          git fetch origin main --prune --tags
          git rev-parse "refs/tags/${DEPLOY_TAG}" >/dev/null
          DEPLOY_SHA="$(git rev-list -n 1 "refs/tags/${DEPLOY_TAG}")"
          git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main
          git checkout --detach "${DEPLOY_TAG}"
          PREVIOUS_SHA="$(make --no-print-directory current-prod-image-sha 2>/dev/null || true)"
          if APP_IMAGE_TAG="${DEPLOY_SHA}" make deploy-prod; then
            exit 0
          else
            code="$?"
            if [ -n "${PREVIOUS_SHA}" ]; then
              git checkout --detach "${PREVIOUS_SHA}"
              APP_IMAGE_TAG="${PREVIOUS_SHA}" make rollback-prod || true
            else
              echo "Rollback skipped: running production image has no revision label." >&2
            fi
            exit "${code}"
          fi
          EOF
