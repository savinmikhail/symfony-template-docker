name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: production-release-${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') && 'tags' || github.run_id }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Validate latest successful release tag
        id: candidate
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const tag = run.head_branch;
            if (!/^v\d+\.\d+\.\d+$/.test(tag || '')) return;
            const repo = context.repo;
            const tags = await github.paginate(github.rest.repos.listTags, {...repo, per_page: 100});
            const releases = tags.filter(t => /^v\d+\.\d+\.\d+$/.test(t.name));
            releases.sort((a, b) => {
              const x = a.name.slice(1).split('.').map(BigInt);
              const y = b.name.slice(1).split('.').map(BigInt);
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i] ? -1 : 1;
              return 0;
            });
            if (releases[0]?.name !== tag) {
              core.notice(`Skipping superseded release ${tag}`);
              return;
            }
            const commit = await github.rest.repos.getCommit({...repo, ref: `refs/tags/${tag}`});
            if (commit.data.sha !== run.head_sha) throw new Error('Tag no longer matches checked CI revision');
            // Old CI tags still deploy inline during migration. Never deploy them twice.
            try {
              await github.rest.repos.getContent({...repo, path: '.github/workflows/release.yml', ref: run.head_sha});
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setOutput('tag', tag);
      - uses: actions/checkout@v6
        if: steps.candidate.outputs.tag != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine release scope
        id: scope
        if: steps.candidate.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: echo 'scope=full' >> "$GITHUB_OUTPUT"
  deploy:
    needs: candidate
    if: github.repository != 'savinmikhail/symfony-template-docker' && needs.candidate.outputs.tag != '' && needs.candidate.outputs.scope != 'frontend-only'
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.candidate.outputs.tag }}
    secrets: inherit
