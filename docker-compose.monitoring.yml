x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://127.0.0.1:${APP_LOKI_PORT:-3100}/loki/api/v1/push"
    mode: "non-blocking"
    keep-file: "true"
    loki-retries: "2"
    loki-max-backoff: "800ms"
    loki-timeout: "1s"

x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # kics-scan ignore-block
  frontend:
    logging: *loki-logging

  # kics-scan ignore-block
  php:
    logging: *loki-logging

  # kics-scan ignore-block
  nginx:
    logging: *loki-logging

  # kics-scan ignore-block
  db:
    logging: *loki-logging

  # kics-scan ignore-block
  redis:
    logging: *loki-logging

  # kics-scan ignore-block
  rabbitmq:
    logging: *loki-logging

  # kics-scan ignore-block
  postgres-backup:
    profiles: ["prod"]
    logging: *loki-logging

  nginx-exporter:
    <<: *security-defaults
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"
    ports:
      - "127.0.0.1:${APP_NGINX_EXPORTER_PORT:-9113}:9113"
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD-SHELL", "/bin/wget -q -O /dev/null http://127.0.0.1:9113/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-exporter:
    <<: *security-defaults
    image: prometheuscommunity/postgres-exporter:v0.10.1
    restart: unless-stopped
    command:
      - "--collector.stat_statements"
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
    volumes:
      - ./docker/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "127.0.0.1:${APP_PG_EXPORTER_PORT:-9187}:9187"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/bin/wget -q -O /dev/null http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  php-fpm-exporter:
    <<: *security-defaults
    image: hipages/php-fpm_exporter:2.2.0
    restart: unless-stopped
    command:
      - "--phpfpm.scrape-uri=tcp://php:9000/fpm-status"
    ports:
      - "127.0.0.1:${APP_PHP_FPM_EXPORTER_PORT:-9253}:9253"
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9253/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    <<: *security-defaults
    image: prom/prometheus:v2.53.1
    restart: unless-stopped
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${APP_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - nginx-exporter
      - postgres-exporter
      - php-fpm-exporter
    healthcheck:
      test: ["CMD-SHELL", "/bin/wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup-metrics-exporter:
    <<: *security-defaults
    image: prom/node-exporter:v1.8.2
    profiles: ["prod"]
    restart: unless-stopped
    command:
      - "--collector.disable-defaults"
      - "--collector.textfile"
      - "--collector.textfile.directory=/textfile"
      - "--web.listen-address=:9100"
    volumes:
      - ./var/backups/.metrics:/textfile:ro
    ports:
      - "127.0.0.1:${APP_BACKUP_METRICS_EXPORTER_PORT:-9100}:9100"
    depends_on:
      - postgres-backup

  grafana:
    <<: *security-defaults
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${APP_GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${APP_GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${APP_GRAFANA_ROOT_URL:-http://localhost:3000/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "${APP_GRAFANA_SERVE_FROM_SUB_PATH:-false}"
    volumes:
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ./tmp/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  loki:
    <<: *security-defaults
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:${APP_LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  prometheus-data:
  loki-data:
