apiVersion: 1
groups:
  - orgId: 1
    name: service-application-errors
    folder: Application Errors
    interval: 30s
    rules:
      - uid: service_application_errors
        title: Service — ошибки приложения
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 300, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              expr: 'sum by (service, channel, error_kind, error_severity) (count_over_time({compose_project=~".+"} | label_format service=`{{ .service | default .compose_service | default .container_name | default "unknown" }}` | json event="message", level_name="level_name", channel="channel", exception_message="context.exception.message", exception_class="context.exception.class" | __error__="" | exception_class!~".*(NotFoundHttpException|AccessDeniedHttpException|UnauthorizedHttpException|MethodNotAllowedHttpException|AccessDeniedException)$" | level_name=~"ERROR|CRITICAL|ALERT|EMERGENCY" | event!="outbound_http_failure" | label_format error_kind=`{{ $text := printf "%s %s" (lower .event) (lower .exception_message) }}{{ if or (contains "jsonexception" (lower .exception_class)) (contains "invalid json" $text) (contains "malformed json" $text) (contains "json could not" $text) (contains "json_decode" $text) (contains "json_encode" $text) (contains "json response" $text) (contains "json pars" $text) (contains "json syntax" $text) (contains "json error" $text) }}json{{ else }}application{{ end }}`, error_severity=`{{ if eq .level_name "ERROR" }}warning{{ else }}critical{{ end }}` [5m]))'
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: B
              expression: $A > 0
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: '{{ if eq $labels.error_kind "json" }}Ошибка обработки JSON{{ else }}Ошибка приложения{{ end }} в сервисе {{ if $labels.service }}{{ $labels.service }}{{ else }}Service{{ end }}.'
          description: 'Категория: {{ $labels.error_kind }}; канал: {{ $labels.channel }}. Ошибок за 5 минут: {{ $values.A.Value }}.'
          action: 'Откройте логи: там исходное исключение и доступный trace. Для JSON проверьте формат ответа и итог retry; HTTP 200 не гарантирует корректный JSON. Не перезапускайте весь pipeline; сначала определите затронутую операцию.'
          logs_query: '{{ "{compose_project=~\".+\"} | label_format service=`{{ .service | default .compose_service | default .container_name | default \"unknown\" }}` | json event=\"message\", level_name=\"level_name\", channel=\"channel\", exception_message=\"context.exception.message\", exception_class=\"context.exception.class\" | __error__=\"\" | exception_class!~\".*(NotFoundHttpException|AccessDeniedHttpException|UnauthorizedHttpException|MethodNotAllowedHttpException|AccessDeniedException)$\" | level_name=~\"ERROR|CRITICAL|ALERT|EMERGENCY\" | event!=\"outbound_http_failure\" | label_format error_kind=`{{ $text := printf \"%s %s\" (lower .event) (lower .exception_message) }}{{ if or (contains \"jsonexception\" (lower .exception_class)) (contains \"invalid json\" $text) (contains \"malformed json\" $text) (contains \"json could not\" $text) (contains \"json_decode\" $text) (contains \"json_encode\" $text) (contains \"json response\" $text) (contains \"json pars\" $text) (contains \"json syntax\" $text) (contains \"json error\" $text) }}json{{ else }}application{{ end }}`, error_severity=`{{ if eq .level_name \"ERROR\" }}warning{{ else }}critical{{ end }}`" }}{{ if $labels.service }} | service={{ printf "%q" $labels.service }}{{ end }} | channel={{ printf "%q" $labels.channel }} | error_kind={{ printf "%q" $labels.error_kind }} | error_severity={{ printf "%q" $labels.error_severity }}'
        labels:
          severity: '{{ $labels.error_severity }}'
          notification_class: application_error
          product: service
