apiVersion: 1

# Access logs also cover upstream 502/504 and the first error after a counter reset.
groups:
  - orgId: 1
    name: service-http-errors
    folder: HTTP Errors
    interval: 30s
    rules:
      - uid: service_nginx_http_5xx
        title: service HTTP 5xx detected
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 300, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              expr: 'sum(count_over_time({compose_service="nginx"} |~ `"status"\s*:\s*"?5[0-9]{2}("|[,}])|" 5[0-9]{2} ` [5m]))'
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: classic_conditions
              refId: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: At least one HTTP 500-599 response occurred in the last 5 minutes.
          description: Inspect nginx access and application logs. Notifications group an incident; this is not one Telegram message per request.
        labels:
          severity: critical
          notification_class: http_5xx
          product: service

